# A generic, single-database configuration for Alembic.

[alembic]
# Path to migration script directory
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# Timezone setting for timestamps in migration files
# timezone = UTC

# Max length of characters for "slug" in filename
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate flags.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a corresponding .py file to be detected as revision scripts
# sourceless = false

# Search path for version locations (supports multiple directories)
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator
# version_path_separator = os

# Default database connection string.
# NOTE: This is overridden dynamically by `alembic/env.py` using `core/config.py` (settings.DATABASE_URL)
sqlalchemy.url = postgresql://rag_user:rag_password@localhost:5432/rag_db


[post_write_hooks]
# Formatting hooks (e.g., automatically format generated migration scripts with Ruff or Black)
# hooks = ruff
# ruff.type = exec
# ruff.exec = ruff check --fix %(files)s && ruff format %(files)s


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S