[project]
name = "ragops"
version = "0.1.0"
description = "RAG indexing pipeline — Phase 0 scaffolding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "alembic>=1.13",
    "psycopg[binary]>=3",
    "pgvector",
    "typer>=0.12",
    "pyyaml",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.ruff]
line-length = 100
target-version = "py312"