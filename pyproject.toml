[project]
name = "ragops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.19.2",
    "pypdf>=6.18.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = [
    "integration: requires a live PostgreSQL database with alembic migrations applied",
    "unit: pure unit tests, no external services required",
]
