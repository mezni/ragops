[project]
name = "ragops"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "chromadb>=0.5.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "openai>=1.0.0",
    "pdf2image>=1.17.0",
    "pdfplumber>=0.11.0",
    "pillow>=10.0.0",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "pytesseract>=0.3.10",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.1",
    "tenacity>=8.2.0",
]

[project.scripts]
ragops = "ingestion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/core", "src/utils"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]